
name: CI

on:
  push:
    branches: [ "main" ]  # Trigger workflow on push to the main branch
  pull_request:
    branches: [ "main" ]  # Trigger workflow on pull request to the main branch
  workflow_dispatch:  # Allow manual trigger of the workflow

jobs:
  build:
    runs-on: [ Windows-latest ]  # Use the latest Ubuntu environment

    steps:
       
      - uses: actions/checkout@v4  # Checkout the repository
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Branch
        run: echo "${{ env.branch }}" # display branch
   
      - name: Build Documentation
        run: |
          python -m pip install --upgrade pip
          python .github/tools/html-creator.py
      - name: Upload GitHub Pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages  # Name the artifact as github-pages
          path: ./Docs  # Specify the path to the artifact
      - name: Summary 
        run: cat summary.md >> $GITHUB_STEP_SUMMARY
      - name: Hello World 
        run: echo "hello " >> $GITHUB_STEP_SUMMARY

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
